<script type="module">
import api from '../../src/scene/api.js';
import '../../src/polyfill/css.js';
import * as helpers from './helpers.js';
import {loadAnimation} from '../../src/deps/lottie.js';
import {animationSoundTriggers} from './animationSoundTriggers.js'
import './elements/modvil-arrow.js';
import './elements/modvil-module.js';
import './elements/modvil-village.js';

const villageLoadSounds = helpers.mobileAndTabletCheck() ? 'village_load_mobile_sounds' : 'village_load_sounds';
api.preload.sounds(villageLoadSounds);
api.preload.sounds('generic_load_sounds');

api.config({
  scroll: true,
  subscribe: false,
  sound: ['village_start'],
});

const homepageMusic = new Audio('../../audio/wenqiao-homepage-music.mp3');
homepageMusic.loop = true;
homepageMusic.preload = 'auto';
homepageMusic.volume = 0.65;
let homepageMusicMuted = true;

function playHomepageMusic() {
  if (!homepageMusicMuted) {
    homepageMusic.play().catch(() => {});
  }
}

api.addEventListener('muted', () => {
  homepageMusicMuted = true;
  homepageMusic.pause();
});
api.addEventListener('unmuted', () => {
  homepageMusicMuted = false;
  playHomepageMusic();
});
api.addEventListener('pause', () => homepageMusic.pause());
api.addEventListener('resume', playHomepageMusic);

api.preload.images(
  'img/ornament.svg',
  'img/village/1.svg',
  'img/village/2.svg',
  'img/village/3.svg',
  'img/village/4.svg',
);

const mainElement = document.querySelector('main');
const villageElement = document.getElementById('village');
const storySection = document.getElementById('wenqiao-story');
const storyStage = document.getElementById('story-stage');
const storyLayers = Array.from(document.querySelectorAll('.story-layer'));
const storyRoute = document.querySelector('.story-route-progress');
const storyArt = document.querySelector('.story-art');
const storyRiders = Array.from(document.querySelectorAll('.story-rider')).map((element, index) => ({
  element,
  controlledByScroll: index === 0,
  speed: [0.038, 0.057, 0.078][index],
  offset: [0.015, 0.16, 0.32][index],
}));
let storyRouteLength = 0;
let storyFurthestProgress = 0;
let storyMotionActive = false;
let storyElapsed = 0;
let storyLastTime = 0;


/**
 * Finds the ratio of scrolling that this element should display at.
 */
function ratioForElement(el) {
  const se = document.scrollingElement;
  const topScroll = se.scrollTop;

  // The start of this element is effectively min window height (can't scroll above this point).
  const effectiveStart = Math.max(0, el.offsetTop - window.innerHeight);
  const effectiveEnd = Math.min(se.offsetHeight - window.innerHeight, el.offsetTop + el.offsetHeight);

  const ratio = (topScroll - effectiveStart) / (effectiveEnd - effectiveStart);

  if (ratio <= 0.0) {
    return 0.0;
  } else if (ratio >= 1.0) {
    return 1.0;
  }
  // This creates more of a cubic-bezier style transform (although it's quite subtle).
  return (Math.sin((ratio - 0.5) * Math.PI) + 1) * 0.5;
}


/**
 * @param {string} id to play for
 * @param {?number} ratio to play at
 */
const updateModuleSoundRatio = (function() {
  const previous = {};

  return (id, ratio) => {
  // TODO(samthor): Should we prevent lots of repeat events here?
  // prevent sending lots of repeat events for [0,1]
  // Klang's config seems to do nothing in this case anyway; the speed would be Infinity
    ratio = ratio || 0;

    if ((previous[id] || 0) === ratio) {
      return;  // already set
    }

    previous[id] = ratio;
    api.play('village_scroll', id, ratio);
  };
}());


async function prepareModules() {
  const main = document.querySelector('main');

  helpers.installAdjustHandler((resized) => {
    let mode = '';
    if (window.innerWidth <= 414) {
      mode = 'mobile';
    } else if (window.innerWidth <= 768) {
      mode = 'small';
    }

    let visible = undefined;  // undefined=at top, true=visible, false=after visible

    const rootMargin = 24;  // include extra space and load early

    const se = document.scrollingElement;
    const windowRangeLow = se.scrollTop - rootMargin;
    const windowRangeHigh = se.scrollTop + window.innerHeight + rootMargin;

    // No scroll sounds on mobile and tablet.
    const isMobileOrTablet = helpers.mobileAndTabletCheck();

    const topRatio = ratioForElement(villageElement);
    if (!isMobileOrTablet) {
      // Top isn't a module, but it has audio cues.
      updateModuleSoundRatio('top', topRatio);
    }
    villageElement.active = topRatio < 1;  // don't render weather if not needed

    const modules = Array.from(main.children).filter((m) => m.localName === 'modvil-module');
    modules.forEach((m) => {
      if (visible !== false) {
        if (m.offsetTop >= windowRangeHigh) {
          visible = false;
        }
      }
      if (visible === undefined) {
        if (m.offsetTop + m.offsetHeight >= windowRangeLow) {
          visible = true;
        }
      }

      // Configure the CE. Ratio of null hints that the scene is invisible.
      const ratio = visible ? ratioForElement(m) : null;
      if (ratio === null) {
        m.ratio = null;
      } else if (!mode) {
        m.ratio = ratio;
      } else {
        m.ratio = 0.5;  // don't animate scroll in small mode
      }
      m.mode = mode;

      const effectiveVisible = visible || false;
      if (m.load !== effectiveVisible) {
        m.resize();  // just resize in case Lottie got stuck and didn't render us
        m.load = effectiveVisible;
      } else {
        resized && m.resize();
      }

      if (!isMobileOrTablet) {
        // Configure ratio of sound.
        updateModuleSoundRatio(m.id, ratio);
      }
    });
  });

  if (!helpers.mobileAndTabletCheck()) {
    main.addEventListener('anim', (e) => {
      const scene = e.target.id;
      const {index, currentTime} = e.detail;
      checkAndPlaySound(scene, index, currentTime);
    });
  }
}

function checkAndPlaySound(scene, index, time) {
  if (animationSoundTriggers[scene] && animationSoundTriggers[scene][index]) {
    const sounds = animationSoundTriggers[scene][index];

    for (let i = 0; i < sounds.length; i++) {
      if (time > sounds[i].time && time < (sounds[i].time + 5) && (performance.now() - sounds[i].played) > 1000) {
        api.play(sounds[i].sound, time);
        sounds[i].played = performance.now();
      }
    }
  }
}

api.preload.wait(prepareModules());

const configureActionButton = (button, callback) => {
  button.addEventListener('click', (ev) => {
    button.classList.add('active');
    callback();
  });
  button.addEventListener('mousedown', () => {
    api.play('generic_button_click');
  });
  button.addEventListener('mouseenter', () => {
    api.play('generic_button_over');
  });
  button.addEventListener('touchdown', () => {
    api.play('generic_button_click');
  });
};

// Game and family-guide actions are intentionally absent on this single-scene homepage.

let scrollFrame = 0;

function updateStoryScene(timestamp = performance.now()) {
  scrollFrame = 0;

  if (storyMotionActive && storyLastTime) {
    storyElapsed += Math.min(0.1, (timestamp - storyLastTime) / 1000);
  }
  storyLastTime = storyMotionActive ? timestamp : 0;

  const scrollTop = document.scrollingElement.scrollTop;
  const sectionTop = storySection.getBoundingClientRect().top + scrollTop;
  const scrollLength = Math.max(1, storySection.offsetHeight - window.innerHeight);
  const progress = Math.max(0, Math.min(1, (scrollTop - sectionTop) / scrollLength));
  if (!storyRouteLength) {
    storyRouteLength = storyRoute.getTotalLength();
    storyRoute.style.strokeDasharray = storyRouteLength;
  }

  let leadingRider = 0;
  storyRiders.forEach(({element, controlledByScroll, speed, offset}) => {
    const riderProgress = controlledByScroll ? 0.035 + progress * 0.93 : (storyElapsed * speed + offset) % 1;
    leadingRider = Math.max(leadingRider, riderProgress);
    const distance = storyRouteLength * riderProgress;
    const point = storyRoute.getPointAtLength(distance);
    const before = storyRoute.getPointAtLength(Math.max(0, distance - 3));
    const after = storyRoute.getPointAtLength(Math.min(storyRouteLength, distance + 3));
    const artRect = storyArt.getBoundingClientRect();
    const stageRect = storyStage.getBoundingClientRect();
    const tangentX = (after.x - before.x) * artRect.width / 1000;
    const tangentY = (after.y - before.y) * artRect.height / 600;
    const angle = Math.atan2(tangentY, tangentX) * 180 / Math.PI;
    element.style.left = `${artRect.left - stageRect.left + point.x * artRect.width / 1000}px`;
    element.style.top = `${artRect.top - stageRect.top + point.y * artRect.height / 600}px`;
    element.style.setProperty('--rider-angle', `${angle}deg`);
  });

  storyFurthestProgress = Math.max(storyFurthestProgress, progress, leadingRider);
  storyRoute.style.strokeDashoffset = storyRouteLength * (1 - storyFurthestProgress);

  storyLayers.forEach((layer, index) => {
    const reveal = Math.max(0, Math.min(1, (progress - index * 0.14) / 0.3));
    layer.style.opacity = reveal;
    layer.style.transform = `translateY(${(1 - reveal) * 18}px)`;
  });

  if (storyMotionActive) {
    scrollFrame = window.requestAnimationFrame(updateStoryScene);
  }
}

function scheduleStoryScene() {
  if (!scrollFrame) {
    scrollFrame = window.requestAnimationFrame(updateStoryScene);
  }
}

window.addEventListener('scroll', scheduleStoryScene, {passive: true});
window.addEventListener('resize', scheduleStoryScene);
if ('IntersectionObserver' in window) {
  const storyObserver = new IntersectionObserver(([entry]) => {
    storyMotionActive = entry.isIntersecting;
    if (storyMotionActive) {
      scheduleStoryScene();
    } else {
      storyLastTime = 0;
    }
  }, {rootMargin: '120px 0px'});
  storyObserver.observe(storySection);
} else {
  storyMotionActive = true;
}

api.ready(async () => {
  // jump to target hash (position is often incorrect due to lazy-load)
  function scrollToHash() {
    const hash = window.location.hash;
    if (hash) {
      const el = document.getElementById(hash.substr(1));
      el && el.scrollIntoView({block: 'center', behavior: 'auto'});
    }
  }
  window.addEventListener('hashchange', scrollToHash);
  scrollToHash();

  // force lazy-load
  window.dispatchEvent(new CustomEvent('resize'));
  scheduleStoryScene();
});

</script>
